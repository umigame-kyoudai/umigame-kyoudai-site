<script>
  (function() {
    'use strict';

    var bootState = window.__UMIGAME_ADMIN_BOOT__ || {};
    window.__UMIGAME_ADMIN_BOOT__ = bootState;
    bootState.appScriptLoaded = true;
    bootState.phase = 'App.html読込済み';

    var state = {
      data: null,
      view: 'reservations',
      selectedKey: '',
      settlements: Object.create(null),
      history: [],
      pendingLine: null,
      loading: false
    };

    var els = {};

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startApp, { once: true });
    } else {
      startApp();
    }

    function startApp() {
      if (bootState.initStarted) return;
      bootState.initStarted = true;
      bootState.phase = '初期化開始';

      try {
        init();
      } catch (error) {
        bootState.phase = '初期化エラー';
        showFatalStartupError(error);
      }
    }

    function init() {
      cacheElements();
      bindEvents();

      bootState.phase = 'HTML埋込データ確認';
      var initialData = readInitialAppData();

      if (initialData) {
        state.data = normalizeAppData(initialData);
        bootState.phase = '初期データ描画中';
        populateFilterOptions();
        renderAll();
        setSync('ready', '更新 ' + formatClock(state.data.generatedAt));
        bootState.phase = '表示完了（HTML埋込）';
        bootState.ready = true;
        els.loadingScreen.hidden = true;
        return;
      }

      bootState.phase = '予約データ要求開始';
      loadData(true);
    }

    function readInitialAppData() {
      var errorNode = document.getElementById('adminInitialError');
      var errorText = errorNode ? String(errorNode.textContent || '').trim() : '';

      if (errorText) {
        var embeddedError = JSON.parse(errorText);
        if (embeddedError) throw new Error(String(embeddedError));
      }

      var dataNode = document.getElementById('adminInitialData');
      var dataText = dataNode ? String(dataNode.textContent || '').trim() : '';

      if (!dataText || dataText === 'null') return null;

      return JSON.parse(dataText);
    }

    function cacheElements() {
      [
        'loadingScreen', 'syncState', 'syncText', 'refreshButton',
        'pageTitle', 'summaryGrid', 'attentionBanner', 'attentionTitle',
        'attentionText', 'showAttentionButton', 'listTitle', 'resultCount',
        'searchInput', 'periodFilter', 'statusFilter', 'locationFilter',
        'resetFilters', 'reservationPanel', 'reservationTableBody', 'mobileList', 'emptyState',
        'referralPanel', 'referralResultCount', 'referralSetupNote',
        'referralPartnerBody', 'referralOutcomeBody',
        'drawerBackdrop', 'detailDrawer', 'drawerCustomerName', 'drawerClose',
        'drawerBody', 'lineModal', 'lineModalTitle', 'lineModalClose',
        'lineCancelButton', 'lineConfirmButton', 'lineMessageMeta',
        'linePreviewText', 'toastStack'
      ].forEach(function(id) {
        els[id] = document.getElementById(id);
      });

      var missing = Object.keys(els).filter(function(id) { return !els[id]; });
      if (missing.length) {
        throw new Error('画面部品が不足しています: ' + missing.join(', '));
      }
    }

    function bindEvents() {
      els.refreshButton.addEventListener('click', function() {
        if (!state.loading) window.location.reload();
      });

      [els.searchInput, els.periodFilter, els.statusFilter, els.locationFilter]
        .forEach(function(element) {
          element.addEventListener(element.tagName === 'INPUT' ? 'input' : 'change', function() {
            if (state.view !== 'reservations') {
              setView('reservations');
              return;
            }
            renderReservations();
          });
        });

      els.resetFilters.addEventListener('click', resetFilters);
      els.showAttentionButton.addEventListener('click', function() {
        setView('attention');
      });

      document.querySelectorAll('[data-view]').forEach(function(button) {
        button.addEventListener('click', function() {
          setView(button.getAttribute('data-view'));
        });
      });

      els.reservationTableBody.addEventListener('click', handleReservationClick);
      els.mobileList.addEventListener('click', handleReservationClick);
      els.referralOutcomeBody.addEventListener('click', handleReferralAction);
      els.drawerClose.addEventListener('click', closeDrawer);
      els.drawerBackdrop.addEventListener('click', closeDrawer);
      els.drawerBody.addEventListener('click', handleDrawerClick);
      els.drawerBody.addEventListener('input', handleDrawerInput);
      els.drawerBody.addEventListener('change', handleDrawerInput);

      els.lineModalClose.addEventListener('click', cancelLinePreview);
      els.lineCancelButton.addEventListener('click', cancelLinePreview);
      els.lineConfirmButton.addEventListener('click', confirmLineSend);

      document.addEventListener('keydown', function(event) {
        if (event.key !== 'Escape') return;
        if (!els.lineModal.hidden) cancelLinePreview();
        else if (els.detailDrawer.classList.contains('is-open')) closeDrawer();
      });
    }

    function gas(functionName, argument, timeoutMs) {
      return new Promise(function(resolve, reject) {
        var settled = false;
        var waitMs = Number(timeoutMs || 45000);
        var timer = setTimeout(function() {
          if (settled) return;
          settled = true;
          reject(new Error(
            functionName + 'の応答が' + Math.round(waitMs / 1000) +
            '秒以内にありませんでした。Webアプリのデプロイ版と実行履歴を確認してください。'
          ));
        }, waitMs);
        var finish = function(handler, value) {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          handler(value);
        };
        var runner = google.script.run
          .withSuccessHandler(function(value) { finish(resolve, value); })
          .withFailureHandler(function(error) {
            finish(
              reject,
              new Error(error && error.message ? error.message : String(error))
            );
          });

        if (typeof argument === 'undefined') runner[functionName]();
        else runner[functionName](argument);
      });
    }

    async function loadData(showFullLoader) {
      if (state.loading) return;
      state.loading = true;
      var previousData = state.data;
      var hadUsableData = !!previousData && !!bootState.ready;

      try {
        setSync('loading', '最新情報を確認中');
        els.refreshButton.disabled = true;
        if (showFullLoader) els.loadingScreen.hidden = false;

        var previousSelected = state.selectedKey;
        bootState.phase = 'GAS応答待ち';
        var responseJson = await gas('adminGetAppDataJson', undefined, 45000);
        if (typeof responseJson !== 'string' || !responseJson) {
          throw new Error('予約データの返却形式が不正です。');
        }
        state.data = normalizeAppData(JSON.parse(responseJson));
        bootState.phase = '画面描画中';
        populateFilterOptions();
        renderAll();

        var selectedAfterLoad = state.selectedKey || previousSelected;
        if (selectedAfterLoad && findBooking(selectedAfterLoad)) {
          state.selectedKey = selectedAfterLoad;
          renderDrawer();
        } else if (selectedAfterLoad) {
          state.selectedKey = '';
          state.history = [];
          closeDrawer();
        }

        setSync('ready', '更新 ' + formatClock(state.data.generatedAt));
        bootState.phase = '表示完了';
        bootState.ready = true;
      } catch (error) {
        state.data = previousData;
        bootState.phase = '読込エラー';
        bootState.lastError = error && error.message ? error.message : String(error);
        setSync('error', '読み込みエラー');
        showToast(error.message, 'error', 6500);
        if (!hadUsableData) {
          showFatalStartupError(error);
        }
      } finally {
        state.loading = false;
        els.refreshButton.disabled = false;
        if (bootState.ready || hadUsableData) els.loadingScreen.hidden = true;
      }
    }

    function normalizeAppData(value) {
      if (!value || typeof value !== 'object') {
        throw new Error('予約データ本体が見つかりません。');
      }
      if (!Array.isArray(value.reservations)) {
        throw new Error('予約一覧の返却形式が不正です。');
      }

      value.options = value.options && typeof value.options === 'object'
        ? value.options
        : {};
      ['locations', 'staff', 'plans', 'planCatalog'].forEach(function(key) {
        if (!Array.isArray(value.options[key])) value.options[key] = [];
      });

      value.referrals = normalizeReferralData(value.referrals);

      return value;
    }

    function normalizeReferralData(value) {
      var fallback = {
        available: false,
        error: '',
        monthLabel: '',
        summary: {
          monthBookings: 0,
          monthRevenue: 0,
          monthPartnerReward: 0,
          monthCompanyShare: 0,
          unconfirmedReward: 0,
          confirmedReward: 0,
          paidReward: 0
        },
        partners: [],
        outcomes: []
      };

      if (!value || typeof value !== 'object') return fallback;
      value.summary = value.summary && typeof value.summary === 'object'
        ? value.summary
        : fallback.summary;
      if (!Array.isArray(value.partners)) value.partners = [];
      if (!Array.isArray(value.outcomes)) value.outcomes = [];
      return value;
    }

    function showFatalStartupError(error) {
      if (typeof window.__showUmigameAdminFatal === 'function') {
        window.__showUmigameAdminFatal(
          error && error.message ? error.message : String(error),
          bootState.phase || '不明'
        );
        return;
      }

      var loading = document.getElementById('loadingScreen');
      if (loading) {
        loading.hidden = false;
        loading.textContent = '予約管理画面を起動できませんでした: ' +
          (error && error.message ? error.message : String(error));
      }
    }

    function populateFilterOptions() {
      var currentLocation = els.locationFilter.value || 'all';
      var options = ['<option value="all">すべて</option>', '<option value="未設定">未設定</option>'];

      state.data.options.locations.forEach(function(location) {
        options.push('<option value="' + attr(location) + '">' + escapeHtml(location) + '</option>');
      });

      els.locationFilter.innerHTML = options.join('');
      if ([].slice.call(els.locationFilter.options).some(function(option) {
        return option.value === currentLocation;
      })) {
        els.locationFilter.value = currentLocation;
      }
    }

    function renderAll() {
      if (!state.data) return;
      state.data.dashboard = buildDashboard(state.data.reservations);
      renderSummary();
      renderAttention();
      renderReservations();
      renderReferrals();
      updateNavigation();
    }

    function renderSummary() {
      if (state.view === 'referrals') {
        renderReferralSummary();
        return;
      }

      var dashboard = state.data.dashboard;
      var cards = [
        {
          label: '今日の予約',
          value: dashboard.today,
          note: '明日 ' + dashboard.tomorrow + '件',
          icon: '◷',
          color: '#0f8b8d',
          soft: '#d9f0ed'
        },
        {
          label: '本日以降の未対応',
          value: dashboard.futurePending,
          note: '確認・返信が必要',
          icon: '!',
          color: '#a46a08',
          soft: '#fff1c9'
        },
        {
          label: '開催場所 案内待ち',
          value: dashboard.locationMissing,
          note: '明日昼 ' + dashboard.dayLocationDue + '件 / 本日夜 ' + dashboard.nightLocationDue + '件',
          icon: '⌖',
          color: '#cf5a55',
          soft: '#fbe8e6'
        },
        {
          label: '確定売上',
          value: formatMoney(dashboard.confirmedSales),
          note: 'クーポン ' + formatMoney(dashboard.confirmedCoupons),
          icon: '¥',
          color: '#2f8f72',
          soft: '#e3f4ed'
        }
      ];

      els.summaryGrid.innerHTML = cards.map(function(card) {
        var compactValueClass = String(card.value).length >= 9 ? ' is-compact' : '';

        return '<article class="summary-card" style="--card-color:' + card.color + ';--card-soft:' + card.soft + '">' +
          '<div class="summary-label">' + escapeHtml(card.label) + '</div>' +
          '<div class="summary-value' + compactValueClass + '">' + escapeHtml(String(card.value)) + '</div>' +
          '<div class="summary-note">' + escapeHtml(card.note) + '</div>' +
          '<div class="summary-icon" aria-hidden="true">' + escapeHtml(card.icon) + '</div>' +
          '</article>';
      }).join('');
    }

    function renderReferralSummary() {
      var referrals = state.data.referrals || normalizeReferralData(null);
      var summary = referrals.summary;
      var month = referrals.monthLabel || '今月';
      var cards = [
        {
          label: '今月の紹介予約', value: Number(summary.monthBookings || 0) + '件',
          note: month, icon: '↗', color: '#0f8b8d', soft: '#d9f0ed'
        },
        {
          label: '今月の紹介売上', value: formatMoney(summary.monthRevenue),
          note: '割引後の確定売上', icon: '¥', color: '#2f8f72', soft: '#e3f4ed'
        },
        {
          label: '今月の紹介報酬', value: formatMoney(summary.monthPartnerReward),
          note: '予約受付時のスナップショット', icon: 'P', color: '#7a5aa6', soft: '#eee7f7'
        },
        {
          label: '今月の会社取り分', value: formatMoney(summary.monthCompanyShare),
          note: '売上 − 紹介報酬', icon: 'C', color: '#136f82', soft: '#e0f0f3'
        },
        {
          label: '未確定報酬', value: formatMoney(summary.unconfirmedReward),
          note: '全期間・実施確認待ち', icon: '!', color: '#a46a08', soft: '#fff1c9'
        },
        {
          label: '確定報酬', value: formatMoney(summary.confirmedReward),
          note: 'うち支払済 ' + formatMoney(summary.paidReward), icon: '✓', color: '#2f8f72', soft: '#e3f4ed'
        }
      ];

      els.summaryGrid.innerHTML = cards.map(function(card) {
        var compactValueClass = String(card.value).length >= 9 ? ' is-compact' : '';
        return '<article class="summary-card" style="--card-color:' + card.color + ';--card-soft:' + card.soft + '">' +
          '<div class="summary-label">' + escapeHtml(card.label) + '</div>' +
          '<div class="summary-value' + compactValueClass + '">' + escapeHtml(String(card.value)) + '</div>' +
          '<div class="summary-note">' + escapeHtml(card.note) + '</div>' +
          '<div class="summary-icon" aria-hidden="true">' + escapeHtml(card.icon) + '</div>' +
          '</article>';
      }).join('');
    }

    function referralStatusHtml(value) {
      var className = value === '確定'
        ? ' is-confirmed'
        : (value === '取消' ? ' is-canceled' : '');
      return '<span class="referral-status' + className + '">' +
        escapeHtml(value || '未確定') + '</span>';
    }

    function referralPaymentHtml(value) {
      return value === '支払済'
        ? '<span class="referral-status is-paid">支払済</span>'
        : '<span class="referral-status">未払い</span>';
    }

    function referralActionsHtml(outcome) {
      if (outcome.paymentStatus === '支払済') return '<span class="referral-secondary">操作完了</span>';

      var booking = attr(outcome.bookingNumber || '');
      if (outcome.outcomeStatus === '未確定') {
        return '<div class="referral-actions">' +
          '<button class="referral-action is-primary" data-referral-booking="' + booking + '" data-referral-action="confirm">確定</button>' +
          '<button class="referral-action is-danger" data-referral-booking="' + booking + '" data-referral-action="cancel">取消</button>' +
          '</div>';
      }
      if (outcome.outcomeStatus === '確定') {
        return '<div class="referral-actions">' +
          '<button class="referral-action" data-referral-booking="' + booking + '" data-referral-action="unconfirm">未確定へ</button>' +
          '<button class="referral-action is-primary" data-referral-booking="' + booking + '" data-referral-action="paid">支払済</button>' +
          '<button class="referral-action is-danger" data-referral-booking="' + booking + '" data-referral-action="cancel">取消</button>' +
          '</div>';
      }
      return '<button class="referral-action" data-referral-booking="' + booking + '" data-referral-action="unconfirm">未確定へ戻す</button>';
    }

    function renderReferrals() {
      if (!state.data) return;
      var referrals = state.data.referrals || normalizeReferralData(null);
      var partners = referrals.partners || [];
      var outcomes = referrals.outcomes || [];

      els.referralResultCount.textContent = outcomes.length;
      els.referralSetupNote.hidden = referrals.available !== false;
      els.referralSetupNote.textContent = referrals.error || '';

      els.referralPartnerBody.innerHTML = partners.length
        ? partners.map(function(partner) {
          return '<tr>' +
            '<td><span class="referral-primary">' + escapeHtml(partner.name || '名称未登録') + '</span>' +
              '<span class="referral-secondary">' + escapeHtml(partner.code || '') + '</span></td>' +
            '<td class="is-number">' + escapeHtml(String(partner.bookingCount || 0)) + '件</td>' +
            '<td class="is-number">' + escapeHtml(formatMoney(partner.revenue)) + '</td>' +
            '<td class="is-number">' + escapeHtml(formatMoney(partner.partnerReward)) + '</td>' +
            '<td class="is-number">' + escapeHtml(formatMoney(partner.companyShare)) + '</td>' +
          '</tr>';
        }).join('')
        : '<tr><td class="referral-empty" colspan="5">今月の紹介成果はまだありません</td></tr>';

      els.referralOutcomeBody.innerHTML = outcomes.length
        ? outcomes.map(function(outcome) {
          var rewardRule = outcome.rewardType === 'PERCENTAGE'
            ? outcome.rewardValue + '%'
            : (outcome.rewardType === 'FIXED_BOOKING'
              ? '1件 ' + formatMoney(outcome.rewardValue)
              : '1名 ' + formatMoney(outcome.rewardValue));
          return '<tr>' +
            '<td><span class="referral-primary">' + escapeHtml(outcome.receivedAt || '') + '</span>' +
              '<span class="referral-secondary">参加 ' + escapeHtml(outcome.participationDate || '') + '</span></td>' +
            '<td><span class="referral-primary">' + escapeHtml(outcome.bookingNumber || '') + '</span>' +
              '<span class="referral-secondary">' + escapeHtml(outcome.planId || '') + '</span></td>' +
            '<td><span class="referral-primary">' + escapeHtml(outcome.name || '') + ' (' + escapeHtml(outcome.code || '') + ')</span>' +
              '<span class="referral-secondary">' + escapeHtml(outcome.campaign || 'キャンペーンなし') + '</span></td>' +
            '<td class="is-number">' + escapeHtml(formatMoney(outcome.revenue)) + '</td>' +
            '<td class="is-number"><span class="referral-primary">' + escapeHtml(formatMoney(outcome.partnerReward)) + '</span>' +
              '<span class="referral-secondary">' + escapeHtml(rewardRule) + '</span></td>' +
            '<td>' + referralStatusHtml(outcome.outcomeStatus) + '</td>' +
            '<td>' + referralPaymentHtml(outcome.paymentStatus) + '</td>' +
            '<td>' + referralActionsHtml(outcome) + '</td>' +
          '</tr>';
        }).join('')
        : '<tr><td class="referral-empty" colspan="8">紹介成果はまだありません</td></tr>';
    }

    async function handleReferralAction(event) {
      var button = event.target.closest('[data-referral-action]');
      if (!button) return;

      var bookingNumber = button.getAttribute('data-referral-booking');
      var action = button.getAttribute('data-referral-action');
      var labels = {
        confirm: 'この紹介成果を確定しますか？',
        unconfirm: 'この紹介成果を未確定へ戻しますか？',
        cancel: 'この紹介成果を取消しますか？',
        paid: '紹介者への支払い完了を確認しましたか？\nこの操作後は管理画面から取消できません。'
      };

      if (!window.confirm(labels[action] || '紹介成果を更新しますか？')) return;

      setButtonBusy(button, true, '更新中');
      try {
        var result = await gas('adminUpdateReferralOutcome', {
          bookingNumber: bookingNumber,
          action: action
        });
        state.data.referrals = normalizeReferralData(result.referrals);
        renderAll();
        showToast('紹介成果を更新しました。', 'success');
      } catch (error) {
        showToast(error.message, 'error', 7000);
      } finally {
        setButtonBusy(button, false);
      }
    }

    function renderAttention() {
      if (state.view === 'referrals') {
        els.attentionBanner.hidden = true;
        return;
      }

      var dashboard = state.data.dashboard;
      var total = dashboard.futurePending + dashboard.locationMissing;

      els.attentionBanner.hidden = total === 0;
      if (!total) return;

      els.attentionTitle.textContent = total + '件の予約に確認事項があります';
      els.attentionText.textContent =
        '未対応 ' + dashboard.futurePending + '件 / 明日昼の場所案内 ' +
        dashboard.dayLocationDue + '件 / 本日夜の場所案内 ' +
        dashboard.nightLocationDue + '件';
    }

    function renderReservations() {
      if (!state.data) return;

      var referralView = state.view === 'referrals';
      els.reservationPanel.hidden = referralView;
      els.referralPanel.hidden = !referralView;
      if (referralView) {
        els.pageTitle.textContent = '紹介';
        return;
      }

      var bookings = getFilteredBookings();
      els.resultCount.textContent = bookings.length;
      els.emptyState.hidden = bookings.length !== 0;

      var titles = {
        reservations: ['予約管理', '予約一覧'],
        today: ['今日・明日の予約', '今日・明日の予約'],
        attention: ['要確認', '確認が必要な予約'],
        referrals: ['紹介', '紹介成果']
      };

      els.pageTitle.textContent = titles[state.view][0];
      els.listTitle.textContent = titles[state.view][1];

      els.reservationTableBody.innerHTML = bookings.map(function(booking) {
        return '<tr>' +
          '<td><span class="date-main">' + escapeHtml(bookingDateDisplay(booking)) + '</span>' +
            '<span class="date-sub">' + escapeHtml(bookingTimeDisplay(booking)) + '</span></td>' +
          '<td><span class="customer-name">' + escapeHtml(booking.name || '名前未登録') + '</span>' +
            '<span class="customer-sub">' + escapeHtml(booking.bookingNumber || '予約番号なし') + '</span></td>' +
          '<td><span class="plan-name">' + escapeHtml(booking.displayPlan || 'プラン未登録') + (!booking.planId ? '（要確認）' : '') + '</span>' +
            (booking.componentCount > 1 ? '<span class="plan-sub">' + booking.componentCount + 'つの予定をまとめて表示</span>' : '') + '</td>' +
          '<td>' + statusChip(booking.bookingStatus) + '</td>' +
          '<td><span class="location-text">' + escapeHtml(booking.location) + '</span></td>' +
          '<td><span class="staff-text">' + escapeHtml(booking.staff) + '</span></td>' +
          '<td class="number-cell">' + escapeHtml(formatMoney(booking.totalPrice)) + '</td>' +
          '<td><button class="row-open" data-open-booking="' + attr(booking.key) + '" aria-label="' + attr(booking.name + '様の詳細を開く') + '">›</button></td>' +
          '</tr>';
      }).join('');

      els.mobileList.innerHTML = bookings.map(function(booking) {
        return '<article class="mobile-booking" data-open-booking="' + attr(booking.key) + '" tabindex="0" role="button" aria-label="' + attr(booking.name + '様の詳細を開く') + '">' +
          '<div class="mobile-booking-head"><div>' +
            '<div class="mobile-booking-date">' + escapeHtml(bookingDateDisplay(booking)) + '</div>' +
            '<div class="mobile-booking-time">' + escapeHtml(bookingTimeDisplay(booking)) + '</div>' +
          '</div>' + statusChip(booking.bookingStatus) + '</div>' +
          '<div class="mobile-booking-name">' + escapeHtml(booking.name || '名前未登録') + '</div>' +
          '<div class="mobile-booking-plan">' + escapeHtml(booking.displayPlan || 'プラン未登録') + (!booking.planId ? '（要確認）' : '') + '</div>' +
          '<div class="mobile-booking-foot">' +
            '<span class="mobile-booking-meta">' + escapeHtml(booking.location) + '・' + escapeHtml(booking.staff) + '</span>' +
            '<strong>' + escapeHtml(formatMoney(booking.totalPrice)) + '</strong>' +
          '</div></article>';
      }).join('');
    }

    function getFilteredBookings() {
      var bookings = state.data.reservations.slice();
      var today = localDateString(new Date());
      var tomorrow = addDays(today, 1);
      var sevenDays = addDays(today, 7);

      if (state.view === 'today') {
        return bookings.filter(function(booking) {
          return bookingHasDate(booking, today) || bookingHasDate(booking, tomorrow);
        });
      }

      if (state.view === 'attention') {
        return bookings.filter(function(booking) {
          var needsConfirmation = bookingHasDateOnOrAfter(booking, today) && (
            booking.bookingStatus === '未対応' ||
            booking.bookingStatus === '混在'
          );

          return needsConfirmation || !!booking.locationGuidanceDue;
        });
      }

      var search = normalizeSearch(els.searchInput.value);
      var period = els.periodFilter.value;
      var status = els.statusFilter.value;
      var location = els.locationFilter.value;

      return bookings.filter(function(booking) {
        if (search) {
          var haystack = normalizeSearch([
            booking.name,
            booking.bookingNumber,
            booking.phone,
            booking.lineName,
            booking.displayPlan,
            booking.acquisitionLabel,
            booking.acquisitionSource,
            booking.headcount,
            booking.components.map(function(component) { return component.plan; }).join(' ')
          ].join(' '));
          if (haystack.indexOf(search) === -1) return false;
        }

        if (period === 'future' && !bookingHasDateOnOrAfter(booking, today)) return false;
        if (period === 'today' && !bookingHasDate(booking, today)) return false;
        if (period === 'tomorrow' && !bookingHasDate(booking, tomorrow)) return false;
        if (period === '7days' && !bookingHasDateInRange(booking, today, sevenDays)) return false;
        if (period === 'past' && bookingHasDateOnOrAfter(booking, today)) return false;
        if (status !== 'all' && booking.bookingStatus !== status) return false;
        if (location !== 'all' && booking.location !== location) return false;

        return true;
      });
    }

    function setView(view, renderNow) {
      state.view = view;
      updateNavigation();
      if (renderNow !== false) {
        renderSummary();
        renderAttention();
        renderReservations();
        renderReferrals();
      }
    }

    function updateNavigation() {
      document.querySelectorAll('[data-view]').forEach(function(button) {
        button.classList.toggle('is-active', button.getAttribute('data-view') === state.view);
      });
    }

    function resetFilters() {
      els.searchInput.value = '';

      els.statusFilter.value = 'all';

      setView('reservations');

    async function openDrawer(key) {
      var booking = findBooking(key);
      if (!booking) return;
      var requestedKey = key;

      state.selectedKey = key;
      state.history = [];
      renderDrawer();

      els.drawerBackdrop.hidden = false;
      els.detailDrawer.setAttribute('aria-hidden', 'false');
      requestAnimationFrame(function() {
        els.detailDrawer.classList.add('is-open');
      });
      document.body.style.overflow = 'hidden';

      try {
        var history = await gas('adminGetHistory', {
          bookingNumber: booking.bookingNumber
        });
        if (state.selectedKey !== requestedKey) return;
        state.history = Array.isArray(history) ? history : [];
        renderDrawerHistory();
      } catch (error) {
        if (state.selectedKey === requestedKey) {
          showToast('送信履歴を取得できませんでした：' + error.message, 'error');
        }
      }
    }

      els.detailDrawer.classList.remove('is-open');
      els.detailDrawer.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
      setTimeout(function() {

    function findPlanCatalog(planId) {
      var catalog = state.data && state.data.options.planCatalog || [];
      for (var i = 0; i < catalog.length; i++) {
        if (catalog[i].id === planId) return catalog[i];
      }
      return null;
    }

    function planRoleFromName(planName) {
      var text = String(planName || '');
      if (text.indexOf('ナイト') !== -1 || text.indexOf('ヤシガニ') !== -1) return 'night';
      if (text.indexOf('SUP') !== -1) return 'sup';
      return 'turtle';
    }

    function currentComponentForRole(booking, role) {
      var components = booking && booking.components || [];
      for (var i = 0; i < components.length; i++) {
        if (planRoleFromName(components[i].plan) === role) return components[i];
      }
      return null;
    }

    function defaultChangeTime(role, plan, date) {
      if (role === 'night') return '19:20';

      if (role === 'sup' && plan && (plan.id === 'S4' || plan.id === 'S8')) {
        var month = Number(String(date || '').split('-')[1] || 0);
        var sunsetTimes = [
          '', '16:45', '17:00', '17:15', '17:30', '17:45', '18:00',
          '18:00', '17:45', '17:15', '16:45', '16:30', '16:30'
        ];
        return sunsetTimes[month] || '17:30';
      }

      return '09:00';
    }

    function changeScheduleFieldsHtml(booking, plan) {
      if (!plan) return '<p>プランを選択してください。</p>';

      var fallbackSource = booking.components && booking.components[0] || {};
      var turtleSource = currentComponentForRole(booking, 'turtle') || {};

      return plan.components.map(function(component) {
        var source = currentComponentForRole(booking, component.role) || {};
        var autoSup = plan.autoSup && component.role === 'sup';
        var date = source.date || turtleSource.date || fallbackSource.date ||
          localDateString(new Date());
        var time = timeInputValue(source.time) ||
          defaultChangeTime(component.role, plan, date);

        if (autoSup) {
          var renderedTurtle = currentComponentForRole(booking, 'turtle') || {};
          date = renderedTurtle.date || date;
          time = addMinutesToTime(
            timeInputValue(renderedTurtle.time) || defaultChangeTime('turtle', plan, date),
            90
          );
        }

        return '<article class="change-schedule-card" data-change-schedule-role="' + attr(component.role) + '">' +
          '<strong>' + escapeHtml(component.plan) + '</strong>' +
          (autoSup ? '<small>海亀と同じ日・90分後に自動設定</small>' : '') +
          '<div class="change-schedule-fields">' +
            '<label class="change-field"><span>参加日</span><input type="date" class="field-input" data-change-date min="' + attr(localDateString(new Date())) + '" value="' + attr(date || '') + '"' + (autoSup ? ' disabled' : '') + '></label>' +
            '<label class="change-field"><span>開始時間</span><input type="time" class="field-input" data-change-time value="' + attr(time || '') + '"' + (autoSup ? ' disabled' : '') + '></label>' +
          '</div>' +
        '</article>';
      }).join('');
    }

    function historyHtml() {
      if (!state.history.length) {
        return '<div class="history-empty">送信履歴はありません</div>';
      }

      return state.history.map(function(item) {
        return '<article class="history-item">' +
          '<div class="history-head"><span class="history-type">' + escapeHtml(item.type || 'LINE送信') + '・' + escapeHtml(item.result || '') + '</span>' +

    function settlementHtml(booking) {
      var entry = settlementState(booking.key);
      var data = entry.data;
      var html = '<p class="line-state">予約料金やCalendar・LINE本文は入金実績ではありません。精算履歴は下のボタンで読み込みます。</p>' +
        '<button type="button" class="secondary-button" data-settlement-load' + (entry.loading || entry.saving ? ' disabled' : '') + '>' + (entry.loading ? '読込中' : '精算履歴を読み込む') + '</button>';
      if (entry.error) html += '<p class="change-warning" role="alert">' + escapeHtml(entry.error) + '</p>';
      if (entry.pending) {
        html += '<p class="change-warning">保存結果を確認できていません。入力内容と受付番号を保持しています。同じ記録を再送して結果を確認してください。</p>' +
          '<button type="button" class="primary-button" data-settlement-retry' + (entry.saving || entry.loading ? ' disabled' : '') + '>' + (entry.saving ? '保存中' : '同じ記録を再送する') + '</button>';
      }
      if (!data) return html;
      html += '<p class="line-state" role="status">' + escapeHtml(data.message || '') + '</p>';
      if (!data.available) return html;
      var summary = data.summary || {};
      var status = ({ unrecorded: '未記録', unsettled: '未精算', settled: '精算済み' })[summary.status] || '要確認';
      html += '<div class="detail-grid">' + infoCard('実受領額', settlementMoney(summary.receivedAmount)) +
        infoCard('最終請求額', settlementMoney(summary.finalCharge)) + infoCard('必要返金額', settlementMoney(summary.refundRequired)) +
        infoCard('実返金済額', settlementMoney(summary.refundedAmount)) +
        infoCard('未返金残額', summary.refundRequired == null ? '未記録' : formatMoney(Math.max(0, summary.refundRequired - Number(summary.refundedAmount || 0)))) + infoCard('精算状況', status) + '</div>';
      var history = Array.isArray(data.history) ? data.history : [];
      html += '<div class="history-list">' + (history.length ? history.map(function(item) {
        return '<article class="history-item"><div class="history-head"><strong>' + escapeHtml(settlementKindLabel(item.kind)) + '</strong>' +
          '<span>' + escapeHtml(item.eventDate || '') + '</span></div><p class="history-message">担当：' + escapeHtml(item.handler || '') +
          '\n記録日時：' + escapeHtml(item.recordedAt || '') + '\n' + escapeHtml(item.note || '') + '</p></article>';
      }).join('') : '<p class="history-empty">精算履歴は未記録です。予約額から自動で入金を補完しません。</p>') + '</div>';
      if (entry.pending || entry.loading || entry.saving) return html;
      if (entry.viewVersion !== booking.version) return html + '<p class="change-warning">予約内容が変更されています。精算履歴を再読み込みしてください。</p>';
      if (data.writable !== true || data.needsReview || !data.plan || !data.plan.id || (data.plan.components || []).length < 2) {
        return html + '<p class="line-state">この予約は精算の書き込み対象になっていません。内容・権限・保存先を確認してください。予約一覧や既存の編集は引き続き利用できます。</p>';
      }
      return html + settlementEditorHtml(data);
    }

    function settlementNumberField(label, attributes, value) {
      return '<label class="change-field"><span>' + escapeHtml(label) + '</span><input class="field-input" type="number" min="0" step="1" ' + attributes +
        ' value="' + attr(value == null ? '' : value) + '"></label>';
    }

    function settlementEditorHtml(data) {
      var history = data.history || [];
      var received = data.summary && data.summary.receivedAmount != null;
      var canReceive = !received || (data.summary.receivedAmount === 0 && (data.summary.finalCharge === null || data.summary.finalCharge === data.packagePrice));
      var canAssess = received && data.summary.finalCharge === null;
      var canRefund = received && data.summary.finalCharge !== null && data.summary.refundRequired > Number(data.summary.refundedAmount || 0);
      var initialKind = canReceive ? 'receive' : canAssess ? 'assess' : canRefund ? 'refund' : 'correct_last';
      var components = data.plan.components || [];
      var choices = (canReceive ? '<option value="receive">実際の受領を記録</option>' : '') +
        (canAssess ? '<option value="assess">実施結果から最終請求を確定</option>' : '') +
        (canRefund ? '<option value="refund">実際の返金を記録</option>' : '') +
        (history.length ? '<option value="correct_last">直前の記録を訂正（無効化）</option>' : '');
      if (!choices) return '';
      return '<div data-settlement-editor data-settlement-new-receipt="' + (received ? 'false' : 'true') + '" class="reservation-change-body">' +
        '<p class="line-state">' + escapeHtml(data.plan.name || data.plan.id) + '／予約料金 ' + escapeHtml(formatMoney(data.packagePrice)) + '（入金実績ではありません）</p>' +
        '<label class="change-field"><span>記録する内容</span><select data-settlement-kind>' + choices + '</select></label>' +
        '<div class="change-grid"><label class="change-field"><span>実際の受領・実施・返金日</span><input type="date" class="field-input" data-settlement-date></label>' +
        '<label class="change-field"><span>記録担当者</span><input class="field-input" data-settlement-handler maxlength="80"></label></div>' +
        '<div data-settlement-amount-section' + (initialKind === 'receive' || initialKind === 'refund' ? '' : ' hidden') + '>' + settlementNumberField('実際に受領／返金した金額（円）', 'data-settlement-amount', '') +
          '<label><input type="checkbox" data-settlement-zero-confirmed> 受領額が0円の場合、実際に未受領であることを確認しました</label></div>' +
        '<div data-settlement-basis' + (received ? ' hidden' : '') + '><p class="line-state">人数と単品料金は、予約時の見積・案内を確認してください。表示単価は確認用の候補で、内部売上配分は使用しません。</p>' +
          '<label class="change-field"><span>人数・単品料金の確認状況</span><select data-settlement-basis-mode><option value="confirmed">人数・全単品料金を確認して記録</option><option value="unconfirmed">人数・単品料金は未確認（全中止の精算のみ）</option></select></label>' +
          '<div data-settlement-known-basis>' +
          '<label class="change-field"><span>単品料金の適用根拠</span><select data-settlement-price-source><option value="current_catalog">現行の単品料金</option><option value="verified_historical">根拠を確認した予約時の旧単価</option></select></label>' +
          '<div class="change-count-grid">' + settlementNumberField('大人の人数', 'data-settlement-count="adult"', '') +
          settlementNumberField('子供の人数', 'data-settlement-count="child"', '') + settlementNumberField('3歳以下の人数', 'data-settlement-count="under3"', '') + '</div>' +
          components.map(function(component) {
            return '<fieldset data-settlement-unit="' + attr(component.id) + '"><legend>' + escapeHtml(component.name || component.id) + 'の単品料金</legend><div class="change-grid">' +
              settlementNumberField('大人単価（円）', 'data-settlement-price="adultPrice"', component.adultPrice) +
              settlementNumberField('子供単価（円）', 'data-settlement-price="childPrice"', component.childPrice) +
              settlementNumberField('3歳以下単価（円）', 'data-settlement-price="under3Price"', component.under3Price) + '</div></fieldset>';
          }).join('') + '</div>' +
          '<p data-settlement-unknown-basis hidden class="change-warning">未確認の人数・単価は空のまま保存します。一部中止の金額計算には使えません。全中止の場合は、確認できた受領額をもとに全額返金できます。</p>' +
          '<label class="change-field"><span>確認できた情報と根拠</span><textarea class="message-compose compact-compose" data-settlement-evidence maxlength="1000" placeholder="受領額の確認根拠。人数・単価が未確認の場合はその範囲も記載"></textarea></label>' +
          '<label><input type="checkbox" data-settlement-basis-confirmed> 実受領額と、人数・単価の確認済み／未確認の範囲を確認しました</label></div>' +
        '<div data-settlement-assess' + (initialKind === 'assess' ? '' : ' hidden') + '><label class="change-field"><span>実施結果</span><select data-settlement-outcome><option value="completed">すべて実施（予約料金を請求）</option><option value="operator_weather">当店判断の悪天候・海況不良中止あり</option></select></label>' +
          '<div data-settlement-performed hidden>' + (data.summary.partialAssessmentAllowed === true ? '<p class="line-state">実際に実施した単品だけ選択してください。全中止はすべて未選択です。</p>' + components.map(function(component) {
            return '<p><label><input type="checkbox" data-settlement-performed-id="' + attr(component.id) + '"> ' + escapeHtml(component.name || component.id) + '</label></p>';
          }).join('') : '<p class="change-warning">人数・単品料金が未確認のため、中止時は全中止の精算のみ可能です。一部を実施した場合はここで確定せず、根拠を確認してください。</p>') + '</div></div>' +
        '<p data-settlement-correction' + (initialKind === 'correct_last' ? '' : ' hidden') + ' class="line-state">入力誤りの訂正です。直前の記録を訂正履歴で無効化し、その前の状態へ戻します。実際に返金したお金を戻す操作ではありません。理由を記入し、正しい内容はその後に新しい記録として入力してください。</p>' +
        '<label class="change-field"><span>記録の理由・根拠（必須）</span><textarea class="message-compose compact-compose" data-settlement-note maxlength="1000"></textarea></label>' +
        '<button type="button" class="primary-button" data-settlement-save>内容を確認して記録する</button></div>';
    }

    function renderSettlement(key) {
      if (state.selectedKey !== key) return;
      var container = els.drawerBody.querySelector('[data-settlement-content]');
      var booking = findBooking(key);
      if (container && booking) container.innerHTML = settlementHtml(booking);
    }

    async function loadSettlement() {
      var booking = findBooking(state.selectedKey);
      if (!booking) return;
      var key = booking.key;
      var entry = settlementState(key);
      if (entry.loading || entry.saving) return;
      entry.loading = true;
      entry.error = '';
      renderSettlement(key);
      try {
        entry.data = await gas('adminGetSettlement', { bookingKey: key });
        entry.viewVersion = booking.version;
      } catch (error) {
        entry.data = null;
        entry.error = '精算履歴を取得できませんでした：' + error.message;
      } finally {
        entry.loading = false;
        renderSettlement(key);
      }
    }

    function updateSettlementFields(editor) {
      if (!editor) return;
      var kind = editor.querySelector('[data-settlement-kind]').value;
      editor.querySelector('[data-settlement-amount-section]').hidden = kind !== 'receive' && kind !== 'refund';
      editor.querySelector('[data-settlement-basis]').hidden = kind !== 'receive' || editor.getAttribute('data-settlement-new-receipt') !== 'true';
      var unknownBasis = editor.querySelector('[data-settlement-basis-mode]').value === 'unconfirmed';
      editor.querySelector('[data-settlement-known-basis]').hidden = unknownBasis;
      editor.querySelector('[data-settlement-unknown-basis]').hidden = !unknownBasis;
      editor.querySelector('[data-settlement-assess]').hidden = kind !== 'assess';
      editor.querySelector('[data-settlement-performed]').hidden = kind !== 'assess' || editor.querySelector('[data-settlement-outcome]').value !== 'operator_weather';
      editor.querySelector('[data-settlement-correction]').hidden = kind !== 'correct_last';
    }

    function settlementInteger(input, label) {
      var raw = input ? String(input.value).trim() : '';
      if (!/^\d+$/.test(raw) || !Number.isSafeInteger(Number(raw))) throw new Error(label + 'は0以上の整数で入力してください。');
      return Number(raw);
    }

    function settlementRequest(booking, data, editor) {
      if (!data || data.writable !== true || data.needsReview) throw new Error('この予約は精算を書き込めません。');
      var value = function(selector) { var input = editor.querySelector(selector); return input ? String(input.value).trim() : ''; };
      var request = { bookingKey: booking.key, expectedBookingVersion: data.bookingVersion, expectedSettlementVersion: data.historyVersion,
        kind: value('[data-settlement-kind]'), eventDate: value('[data-settlement-date]'), handler: value('[data-settlement-handler]'), note: value('[data-settlement-note]') };
      var dateValue = new Date(request.eventDate + 'T00:00:00Z');
      if (!/^\d{4}-\d{2}-\d{2}$/.test(request.eventDate) || isNaN(dateValue.getTime()) || dateValue.toISOString().slice(0, 10) !== request.eventDate || !request.handler) throw new Error('実際の日付と記録担当者を入力してください。');
      if (!request.note) throw new Error('記録理由（訂正時は訂正理由）を入力してください。');
      if (request.kind === 'receive' || request.kind === 'refund') request.amount = settlementInteger(editor.querySelector('[data-settlement-amount]'), '実際の金額');
      if (request.kind === 'receive') {
        if (data.summary.receivedAmount > 0) throw new Error('受領は記録済みです。');
        if (request.amount !== 0 && request.amount !== data.packagePrice) throw new Error('実際に受け取った予約料金全額、または確認済み未受領の0円を記録してください。');
        if (request.amount === 0 && !editor.querySelector('[data-settlement-zero-confirmed]').checked) throw new Error('0円の受領記録には、実際に未受領であることの確認が必要です。');
        if (data.summary.receivedAmount === 0) {
          if (request.amount !== data.packagePrice || request.amount === 0) throw new Error('未受領の確認後は、実際に受け取った予約料金全額を記録してください。');
          return request;
        }
        var confirmed = editor.querySelector('[data-settlement-basis-confirmed]');
        if (!confirmed || !confirmed.checked || !value('[data-settlement-evidence]')) throw new Error('実受領額・人数・単品料金の確認状況の確認と根拠の入力が必要です。');
        var basisMode = value('[data-settlement-basis-mode]');
        if (basisMode === 'unconfirmed') {
          request.priceBasis = { counts: null, unitPrices: null, evidence: value('[data-settlement-evidence]'), source: 'current_catalog', confirmed: true };
          return request;
        }
        if (basisMode !== 'confirmed') throw new Error('人数・単品料金の確認状況を選択してください。');
        var counts = {};
        ['adult', 'child', 'under3'].forEach(function(category) { counts[category] = settlementInteger(editor.querySelector('[data-settlement-count="' + category + '"]'), '人数'); });
        if (counts.adult + counts.child < 1 || counts.under3 !== 0) throw new Error('セットの参加人数を確認してください。3歳以下はセットに参加できません。');
        var unitPrices = {};
        [].slice.call(editor.querySelectorAll('[data-settlement-unit]')).forEach(function(field) {
          var prices = {};
          ['adultPrice', 'childPrice', 'under3Price'].forEach(function(category) { prices[category] = settlementInteger(field.querySelector('[data-settlement-price="' + category + '"]'), '単品料金'); });
          unitPrices[field.getAttribute('data-settlement-unit')] = prices;
        });
        var priceSource = value('[data-settlement-price-source]');
        if (priceSource !== 'current_catalog' && priceSource !== 'verified_historical') throw new Error('単品料金の適用根拠を選択してください。');
        if (priceSource === 'current_catalog' && (data.plan.components || []).some(function(component) {
          var prices = unitPrices[component.id];
          return !prices || ['adultPrice', 'childPrice', 'under3Price'].some(function(category) { return prices[category] !== component[category]; });
        })) throw new Error('現行料金と異なる場合は、根拠を確認した予約時の旧単価を選択してください。');
        request.priceBasis = { counts: counts, unitPrices: unitPrices, evidence: value('[data-settlement-evidence]'), source: priceSource, confirmed: true };
      } else if (request.kind === 'assess') {
        if (data.summary.receivedAmount == null || data.summary.finalCharge != null) throw new Error('受領状況の記録後に最終請求を確定してください。確定済み金額の訂正は直前記録の訂正から行います。');
        request.outcome = value('[data-settlement-outcome]');
        if (request.outcome !== 'completed' && request.outcome !== 'operator_weather') throw new Error('実施結果を選択してください。');
        request.performedPlanIds = request.outcome === 'completed' ? (data.plan.components || []).map(function(component) { return component.id; }) :
          [].slice.call(editor.querySelectorAll('[data-settlement-performed-id]')).filter(function(input) { return input.checked; }).map(function(input) { return input.getAttribute('data-settlement-performed-id'); });
        if (request.outcome === 'operator_weather' && request.performedPlanIds.length >= data.plan.components.length) throw new Error('中止したツアーは実施済みにチェックしないでください。');
        if (request.outcome === 'operator_weather' && request.performedPlanIds.length && data.summary.partialAssessmentAllowed !== true) throw new Error('人数・単品料金が未確認のため、一部中止の金額は計算できません。');
      } else if (request.kind === 'correct_last') {
        var last = (data.history || []).slice(-1)[0];
        if (!last || !request.note) throw new Error('訂正する直前の記録と訂正理由が必要です。');
        request.correctsEventId = last.eventId;
      } else if (request.kind === 'refund') {
        if (data.summary.finalCharge == null || request.amount <= 0 || request.amount > data.summary.refundRequired - Number(data.summary.refundedAmount || 0)) throw new Error('実返金額は確定済みの未返金残額を超えない金額で入力してください。');
      } else throw new Error('記録する内容を選択してください。');
      return request;
    }

    function settlementConfirmation(request, data) {
      var lines = ['精算履歴へ記録します。', settlementKindLabel(request.kind), '日付：' + request.eventDate, '担当：' + request.handler];
      if (typeof request.amount === 'number') lines.push('実際の金額：' + formatMoney(request.amount));
      if (request.priceBasis) {
        if (request.priceBasis.counts && request.priceBasis.unitPrices) {
          lines.push('人数：大人' + request.priceBasis.counts.adult + '名／子供' + request.priceBasis.counts.child + '名／3歳以下' + request.priceBasis.counts.under3 + '名');
          (data.plan.components || []).forEach(function(component) {
            var prices = request.priceBasis.unitPrices[component.id];
            lines.push(component.name + ' 単品：大人' + formatMoney(prices.adultPrice) + '／子供' + formatMoney(prices.childPrice) + '／3歳以下' + formatMoney(prices.under3Price));
          });
          lines.push('単価：' + (request.priceBasis.source === 'verified_historical' ? '根拠確認済みの旧単価' : '現行料金'));
        } else lines.push('人数・単品料金：未確認。中止時は全中止の精算のみ可能です。');
        lines.push('確認根拠：' + request.priceBasis.evidence);
      }
      if (request.kind === 'assess') lines.push(request.outcome === 'completed' ? 'すべて実施：予約料金 ' + formatMoney(data.packagePrice) + 'を請求' :
        '当店判断による中止／実施した単品：' + ((data.plan.components || []).filter(function(component) { return request.performedPlanIds.indexOf(component.id) >= 0; }).map(function(component) { return component.name; }).join('、') || 'なし（全中止）'));
      if (request.correctsEventId) lines.push('訂正対象：' + request.correctsEventId);
      lines.push('メモ：' + (request.note || 'なし'), '', 'この操作では送金やLINE送信は行いません。');
      return lines.join('\n');
    }

    async function saveSettlement(retry) {
      var booking = findBooking(state.selectedKey);
      if (!booking) return;
      var key = booking.key;
      var entry = settlementState(key);
      if (entry.loading || entry.saving) return;
      try {
        if (!entry.pending) {
          if (retry) return;
          var editor = els.drawerBody.querySelector('[data-settlement-editor]');
          if (!editor || entry.viewVersion !== booking.version) throw new Error('精算履歴を再読み込みしてください。');
          var request = settlementRequest(booking, entry.data, editor);
          if (!window.confirm(settlementConfirmation(request, entry.data))) return;
          request.requestId = window.crypto && window.crypto.randomUUID ? window.crypto.randomUUID() : 'settlement-' + Date.now() + '-' + Math.random().toString(36).slice(2);
          entry.pending = JSON.parse(JSON.stringify(request));
        } else if (!retry) return;
        entry.saving = true;
        entry.error = '';
        renderSettlement(key);
        var result = await gas('adminSaveSettlement', entry.pending);
        if (!result || result.success !== true) throw new Error('保存完了を確認できませんでした。');
        entry.data = result;
        entry.viewVersion = booking.version;
        entry.pending = null;
        showToast(result.replayed ? '同じ記録の保存済み結果を確認しました。' : '精算履歴を記録しました。', 'success');
      } catch (error) {
        entry.error = error.message;
        if (!entry.pending) showToast(error.message, 'error');
      } finally {
        entry.saving = false;
        renderSettlement(key);
      }
    }

    function handleDrawerClick(event) {
      if (event.target.closest('[data-settlement-load]')) { loadSettlement(); return; }
      if (event.target.closest('[data-settlement-save]')) { saveSettlement(false); return; }
      if (event.target.closest('[data-settlement-retry]')) { saveSettlement(true); return; }

      var deleteButton = event.target.closest('[data-delete-booking]');
      if (deleteButton) {
        deleteBooking(deleteButton);
        return;
      }

      var scheduleButton = event.target.closest('[data-save-schedule]');
      if (scheduleButton) {
        saveSchedule(scheduleButton);
        return;
      }

      var changeButton = event.target.closest('[data-save-reservation-change]');
      if (changeButton) {
        saveReservationChange(changeButton);
        return;
      }

      var statusButton = event.target.closest('[data-status-value]');
      if (statusButton) {
        updateStatus(statusButton);
        return;
      }

      var saveButton = event.target.closest('[data-save-component]');
      if (saveButton) {
        saveComponent(saveButton);
        return;
      }

      if (event.target.id === 'previewCustomLine') {
        previewCustomLine(event.target);
      }
    }

    async function deleteBooking(button) {
      var booking = findBooking(state.selectedKey);
      if (!booking) return;

      if (!window.confirm(
        'この予約を削除しますか？\n\n' +
        'お客様：' + (booking.name || '名前未登録') + ' 様\n' +
        '予約番号：' + booking.bookingNumber + '\n' +
        '対象：予約一覧 ' + booking.componentCount + '行と、同じ予約番号のGoogleカレンダー予定\n\n' +
        '元データは「削除済み予約」シートへ退避されます。\n' +
        'お客様へLINEは送信されません。'
      )) {
        return;
      }

      setButtonBusy(button, true, '削除中');

      try {
        var result = await gas('adminDeleteBooking', {
          bookingKey: booking.key,
          expectedVersion: booking.version,
          confirmed: true
        });

        state.data.reservations = state.data.reservations.filter(function(item) {
          return item.key !== booking.key;
        });
        state.selectedKey = '';
        state.history = [];

        closeDrawer();
        renderAll();

        showToast(
          '予約を削除しました。予約一覧' + result.deletedRowCount +
          '行・カレンダー' + result.deletedCalendarCount +
          '件を処理し、「削除済み予約」へ退避しました。',
          'success',
          7000
        );

        if (result.warning) showToast(result.warning, 'error', 9000);

      } catch (error) {
        showToast(error.message, 'error', 8500);
      } finally {
        setButtonBusy(button, false);
      }
    }

    function handleDrawerInput(event) {
      if (event.target.matches('[data-settlement-kind], [data-settlement-outcome], [data-settlement-basis-mode]')) {
        updateSettlementFields(event.target.closest('[data-settlement-editor]'));
        return;
      }
      var changeEditor = event.target.closest('[data-change-editor]');
      if (changeEditor) {
        handleReservationChangeInput(event, changeEditor);
        return;
      }

      var input = event.target.closest('[data-schedule-role="turtle"]');
      if (!input) return;

      var booking = findBooking(state.selectedKey);
      if (!booking || !isAutoSupSchedule(booking)) return;

      var supDateInput = els.drawerBody.querySelector('[data-schedule-date-row][data-schedule-role="sup"]');
      var supTimeInput = els.drawerBody.querySelector('[data-schedule-time-row][data-schedule-role="sup"]');
      var turtleDateInput = els.drawerBody.querySelector('[data-schedule-date-row][data-schedule-role="turtle"]');
      var turtleTimeInput = els.drawerBody.querySelector('[data-schedule-time-row][data-schedule-role="turtle"]');

      if (supDateInput && turtleDateInput) supDateInput.value = turtleDateInput.value;
      if (supTimeInput && turtleTimeInput) {
        supTimeInput.value = addMinutesToTime(turtleTimeInput.value, 90);
      }
    }

    function handleReservationChangeInput(event, editor) {
      var booking = findBooking(state.selectedKey);
      if (!booking) return;

      var planSelect = editor.querySelector('[data-change-plan]');
      var plan = findPlanCatalog(planSelect && planSelect.value);

      if (event.target.matches('[data-change-plan]')) {
        var schedules = editor.querySelector('[data-change-schedules]');
        if (schedules) schedules.innerHTML = changeScheduleFieldsHtml(booking, plan);
      }

      var turtleCard = editor.querySelector('[data-change-schedule-role="turtle"]');
      var supCard = editor.querySelector('[data-change-schedule-role="sup"]');

      if (plan && plan.autoSup && turtleCard && supCard) {
        var turtleDate = turtleCard.querySelector('[data-change-date]');
        var turtleTime = turtleCard.querySelector('[data-change-time]');
        var supDate = supCard.querySelector('[data-change-date]');
        var supTime = supCard.querySelector('[data-change-time]');

        if (turtleDate && supDate) supDate.value = turtleDate.value;
        if (turtleTime && supTime) supTime.value = addMinutesToTime(turtleTime.value, 90);
      }

      var countValues = getChangeCounts(editor);
      var standardPrice = calculateChangeStandardPrice(plan, countValues);
      var note = editor.querySelector('[data-standard-price-note]');
      var pricingMode = editor.querySelector('[data-change-pricing-mode]');
      var totalInput = editor.querySelector('[data-change-total]');
      var couponCode = editor.querySelector('[data-change-coupon-code]');
      var couponDiscount = editor.querySelector('[data-change-coupon-discount]');
      var isCombo = plan && plan.id.charAt(0) === 'C';

      if (note) {
        note.textContent = plan
          ? '標準料金の目安：' + formatMoney(standardPrice) +
            '（レンタル・指名料は含みません' +
            (isCombo ? '／セットプランはクーポン対象外' : '') + '）'
          : 'プランの確認が必要です。元予約・メール等を照合してください。';
      }

      if (couponCode) couponCode.disabled = !!isCombo;
      if (couponDiscount) couponDiscount.disabled = !!isCombo;
      if (isCombo) {
        if (couponCode) couponCode.value = '';
        if (couponDiscount) couponDiscount.value = '0';
      }

      // セットへ変更した最初の入力イベントでも、変更前の割引を差し引かない。
      if (plan && pricingMode && pricingMode.value === 'standard' && totalInput) {
        totalInput.value = String(Math.max(
          0,
          standardPrice - Number(couponDiscount && couponDiscount.value || 0)
        ));
      }
    }

    function getChangeCounts(editor) {
      var result = { adult: 0, child: 0, under3: 0 };
      [].slice.call(editor.querySelectorAll('[data-change-count]')).forEach(function(input) {
        result[input.getAttribute('data-change-count')] = Number(input.value || 0);
      });
      return result;
    }

    function calculateChangeStandardPrice(plan, counts) {
      if (!plan) return 0;
      return Number(counts.adult || 0) * Number(plan.adultPrice || 0) +
        Number(counts.child || 0) * Number(plan.childPrice || plan.adultPrice || 0) +
        Number(counts.under3 || 0) * Number(plan.under3Price || 0);
    }

    async function saveReservationChange(button) {
      var booking = findBooking(state.selectedKey);
      var editor = button.closest('[data-change-editor]');
      if (!booking || !editor) return;

      var planId = editor.querySelector('[data-change-plan]').value;
      var plan = findPlanCatalog(planId);
      var counts = getChangeCounts(editor);
      var totalPrice = Number(editor.querySelector('[data-change-total]').value || 0);
      var couponCodeInput = editor.querySelector('[data-change-coupon-code]');
      var couponDiscountInput = editor.querySelector('[data-change-coupon-discount]');
      var reason = editor.querySelector('[data-change-reason]').value.trim();
      var customerName = editor.querySelector('[data-change-name]').value.trim();
      var phone = editor.querySelector('[data-change-phone]').value.trim();
      var email = editor.querySelector('[data-change-email]').value.trim();
      var participants = editor.querySelector('[data-change-participants]').value;
      var participantAges = editor.querySelector('[data-change-ages]').value;
      var participantHeights = editor.querySelector('[data-change-heights]').value;
      var participantWeights = editor.querySelector('[data-change-weights]').value;
      var participantFootSizes = editor.querySelector('[data-change-foot-sizes]').value;
      var specialRequests = editor.querySelector('[data-change-requests]').value;
      var couponCode = couponCodeInput && !couponCodeInput.disabled
        ? couponCodeInput.value.trim()
        : '';
      var couponDiscount = couponDiscountInput && !couponDiscountInput.disabled
        ? Number(couponDiscountInput.value || 0)
        : 0;
      var components = [].slice.call(
        editor.querySelectorAll('[data-change-schedule-role]')
      ).map(function(card) {
        return {
          role: card.getAttribute('data-change-schedule-role'),
          date: card.querySelector('[data-change-date]').value,
          time: card.querySelector('[data-change-time]').value
        };
      });

      if (!plan || !reason) {
        showToast('変更後のプランと変更理由を入力してください。', 'error', 6000);
        return;
      }
      if (counts.adult + counts.child + counts.under3 < 1) {
        showToast('参加人数は1名以上にしてください。', 'error', 6000);
        return;
      }
      if (components.some(function(component) { return !component.date || !component.time; })) {
        showToast('すべての予定の日付と開始時間を入力してください。', 'error', 6000);
        return;
      }

      var afterHeadcount = '大人' + counts.adult + '名 / 子供' + counts.child +
        '名 / 3歳以下' + counts.under3 + '名';
      var scheduleSummary = components.map(function(component) {
        return component.date + ' ' + component.time;
      }).join(' / ');
      var changeLines = [
        'プラン：' + booking.displayPlan + ' → ' + plan.name,
        '日時：' + bookingDateDisplay(booking) + ' ' + bookingTimeDisplay(booking) +
          ' → ' + scheduleSummary,
        '人数：' + customerAgeLabel(booking.headcount) + ' → ' + afterHeadcount,
        '金額：' + formatMoney(booking.totalPrice) + ' → ' + formatMoney(totalPrice)
      ];

      if (customerName !== String(booking.name || '')) {
        changeLines.push('氏名：' + (booking.name || '未入力') + ' → ' + customerName);
      }
      if (phone !== String(booking.phone || '')) {
        changeLines.push('電話：' + (booking.phone || '未入力') + ' → ' + phone);
      }
      if (email !== String(booking.email || '')) {
        changeLines.push('メール：' + (booking.email || '未入力') + ' → ' + (email || '未入力'));
      }
      if (
        couponCode !== String(booking.couponCode || '') ||
        couponDiscount !== Number(booking.couponDiscount || 0)
      ) {
        changeLines.push(
          'クーポン：' + (booking.couponCode || 'なし') + ' / ' +
          formatMoney(booking.couponDiscount || 0) + ' → ' +
          (couponCode || 'なし') + ' / ' + formatMoney(couponDiscount)
        );
      }
      if (
        participants !== String(booking.participants || '') ||
        participantAges !== String(booking.participantAges || '') ||
        participantHeights !== String(booking.participantHeights || '') ||
        participantWeights !== String(booking.participantWeights || '') ||
        participantFootSizes !== String(booking.participantFootSizes || '')
      ) {
        changeLines.push('参加者詳細・数値：変更あり');
      }
      if (specialRequests !== String(booking.specialRequests || '')) {
        changeLines.push('要望・アレルギー等：変更あり');
      }

      var confirmation = [
        '以下の内容へ変更します。',
        '',
        changeLines.join('\n'),
        '理由：' + reason,
        '',
        '予約一覧とGoogleカレンダーを同時に更新します。LINEはまだ送信されません。'
      ].join('\n');

      if (!window.confirm(confirmation)) return;

      setButtonBusy(button, true, '変更中');

      try {
        var result = await gas('adminChangeReservation', {
          bookingKey: booking.key,
          expectedVersion: booking.version,
          planId: planId,
          customerName: customerName,
          phone: phone,
          email: email,
          counts: counts,
          totalPrice: totalPrice,
          couponCode: couponCode,
          couponDiscount: couponDiscount,
          components: components,
          participants: participants,
          participantAges: participantAges,
          participantHeights: participantHeights,
          participantWeights: participantWeights,
          participantFootSizes: participantFootSizes,
          specialRequests: specialRequests,
          reason: reason,
          bookingStatus: booking.bookingStatus
        });

        replaceBooking(result.booking);
        renderAll();
        renderDrawer();

        var messageInput = document.getElementById('customLineMessage');
        if (messageInput && result.suggestedLineMessage) {
          messageInput.value = result.suggestedLineMessage;
        }

        showToast(
          '予約一覧とGoogleカレンダーを変更しました。LINEはまだ送信されていません。',
          'success',
          7000
        );
        if (result.warning) showToast(result.warning, 'error', 9000);

      } catch (error) {
        showToast(error.message, 'error', 9000);
      } finally {
        setButtonBusy(button, false);
      }
    }

            replaceBooking(result.booking);

        showToast('送信キャンセルの確認に失敗しました。次の編集前に画面を再読み込みしてください。', 'error', 7000);

        els.lineModal.hidden = true;

    async function confirmLineSend() {
      if (!state.pendingLine) return;

      var pending = state.pendingLine;
      setButtonBusy(els.lineConfirmButton, true, '送信中');
      els.lineCancelButton.disabled = true;

      try {
        var result = await gas('adminConfirmLine', { token: pending.token });
        if (result.booking) {
          replaceBooking(result.booking);
          renderDrawer();

          throw new Error(result.error || 'LINEを送信できませんでした。');

        state.pendingLine = null;
        els.lineModal.hidden = true;

          result.warning
            ? 'LINEは送信されました。'
            : 'LINEを送信しました。送信履歴にも記録されています。',

        );

          showToast(result.warning, 'error', 8000);
        }

          booking.lastLineResult = result.resultText || '';
          booking.components.forEach(function(component) {

    function replaceBooking(booking) {
      var replaced = false;
      state.data.reservations = state.data.reservations.map(function(existing) {
        if (existing.key !== booking.key) return existing;
        replaced = true;
        return booking;
      });
      if (!replaced) state.data.reservations.push(booking);
      state.data.dashboard = buildDashboard(state.data.reservations);
    }

    function findBooking(key) {
      if (!state.data) return null;
      for (var i = 0; i < state.data.reservations.length; i++) {
        if (state.data.reservations[i].key === key) return state.data.reservations[i];
      }
      return null;
    }

    function buildDashboard(bookings) {
      var today = localDateString(new Date());
      var tomorrow = addDays(today, 1);
      var future = bookings.filter(function(booking) {
        return bookingHasDateOnOrAfter(booking, today);
      });
      var confirmed = bookings.filter(function(booking) { return booking.bookingStatus === '確定'; });

      return {
        totalBookings: bookings.length,
        today: bookings.filter(function(booking) {
          return bookingHasDate(booking, today);
        }).length,
        tomorrow: bookings.filter(function(booking) {
          return bookingHasDate(booking, tomorrow);
        }).length,
        futurePending: future.filter(function(booking) {
          return booking.bookingStatus === '未対応' || booking.bookingStatus === '混在';
        }).length,
        futureConfirmed: future.filter(function(booking) { return booking.bookingStatus === '確定'; }).length,
        futureFull: future.filter(function(booking) { return booking.bookingStatus === '満席'; }).length,
        locationMissing: bookings.filter(function(booking) {
          return booking.locationGuidanceDue;
        }).length,
        dayLocationDue: bookings.filter(function(booking) {
          return booking.dayLocationDue;
        }).length,
        nightLocationDue: bookings.filter(function(booking) {
          return booking.nightLocationDue;
        }).length,
        confirmedSales: confirmed.reduce(function(sum, booking) { return sum + Number(booking.totalPrice || 0); }, 0),
        confirmedCoupons: confirmed.reduce(function(sum, booking) { return sum + Number(booking.couponDiscount || 0); }, 0)
      };
    }

    function bookingDates(booking) {
      var seen = {};

      return (booking && booking.components || []).map(function(component) {
        return String(component.date || '');
      }).filter(function(date) {
        if (!date || seen[date]) return false;
        seen[date] = true;
        return true;
      });
    }

    function bookingHasDate(booking, date) {
      return bookingDates(booking).indexOf(String(date || '')) !== -1;
    }

    function bookingHasDateOnOrAfter(booking, date) {
      return bookingDates(booking).some(function(componentDate) {
        return componentDate >= date;
      });
    }

    function bookingHasDateInRange(booking, startDate, endDate) {
      return bookingDates(booking).some(function(componentDate) {
        return componentDate >= startDate && componentDate <= endDate;
      });
    }

    function bookingDateDisplay(booking) {
      var dates = bookingDates(booking);

      if (!dates.length) return '日付未設定';

      return dates.map(formatDateLabel).join(' / ');
    }

    function bookingTimeDisplay(booking) {
      var components = booking && booking.components || [];
      var dates = bookingDates(booking);

      if (dates.length > 1) {
        return components.map(function(component) {
          var parts = String(component.date || '').split('-');
          var shortDate = parts.length === 3
            ? Number(parts[1]) + '/' + Number(parts[2])
            : String(component.date || '');

          return shortDate + ' ' + (component.time || '時間未設定');
        }).join(' / ');
      }

      var times = [];
      var seen = {};

      components.forEach(function(component) {
        var time = String(component.time || '');
        if (!time || seen[time]) return;
        seen[time] = true;
        times.push(time);
      });

      return times.length ? times.join(' / ') : '時間未設定';
    }

    function customerAgeLabel(value) {
      return String(value || '').replace(/3歳未満/g, '3歳以下');
    }

    function parseHeadcount(value) {
      var text = String(value || '');
      var read = function(pattern) {
        var match = text.match(pattern);
        return match ? Number(match[1] || 0) : 0;
      };

      return {
        adult: read(/大人\s*(\d+)\s*名?/),
        child: read(/子供\s*(\d+)\s*名?/),
        under3: read(/3歳(?:以下|未満)\s*(\d+)\s*名?/)
      };
    }

    function locationOptions(current) {
      var options = ['<option value="">未設定</option>'];
      state.data.options.locations.forEach(function(location) {
        options.push('<option value="' + attr(location) + '"' + (location === current ? ' selected' : '') + '>' + escapeHtml(location) + '</option>');
      });
      return options.join('');
    }

    function statusChoice(value, label, current) {
      var isCurrent = current === label;
      return '<button class="status-choice' + (isCurrent ? ' is-current' : '') + '" data-status-value="' + attr(value) + '">' + escapeHtml(label) + '</button>';
    }

    function infoCard(label, value) {
      return '<div class="info-card"><div class="info-label">' + escapeHtml(label) + '</div><div class="info-value">' + escapeHtml(value) + '</div></div>';
    }

    function statusChip(status) {
      var className = 'status-pending';
      if (status === '確定') className = 'status-confirmed';
      else if (status === '満席') className = 'status-full';
      else if (status === '混在') className = 'status-mixed';
      return '<span class="status-chip ' + className + '">' + escapeHtml(status || '未対応') + '</span>';
    }

    function setButtonBusy(button, busy, busyText) {
      if (!button) return;
      if (busy) {
        button.dataset.originalText = button.textContent;
        button.disabled = true;
        button.textContent = busyText || '処理中';
      } else {
        button.disabled = false;
        if (button.dataset.originalText) {
          button.textContent = button.dataset.originalText;
          delete button.dataset.originalText;
        }
      }
    }

    function setSync(type, text) {
      els.syncState.classList.remove('is-loading', 'is-error');
      if (type === 'loading') els.syncState.classList.add('is-loading');
      if (type === 'error') els.syncState.classList.add('is-error');
      els.syncText.textContent = text;
    }

    function showToast(message, type, duration) {
      var toast = document.createElement('div');
      toast.className = 'toast' + (type ? ' is-' + type : '');
      toast.textContent = message;
      els.toastStack.appendChild(toast);
      setTimeout(function() {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(8px)';
        setTimeout(function() { toast.remove(); }, 220);
      }, duration || 4200);
    }

    function formatMoney(value) {
      return '¥' + Number(value || 0).toLocaleString('ja-JP');
    }

    function formatDateLabel(dateText) {
      var parts = String(dateText || '').split('-');
      if (parts.length !== 3) return dateText || '日付未設定';
      var date = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      var weekdays = ['日', '月', '火', '水', '木', '金', '土'];
      return Number(parts[1]) + '/' + Number(parts[2]) + '（' + weekdays[date.getDay()] + '）';
    }

    function formatClock(isoText) {
      var date = new Date(isoText);
      if (isNaN(date.getTime())) return '完了';
      return ('0' + date.getHours()).slice(-2) + ':' + ('0' + date.getMinutes()).slice(-2);
    }

    function isAutoSupSchedule(booking) {
      var plan = String(booking && booking.displayPlan || '');

      return plan.indexOf('海空セット') !== -1 ||
        plan.indexOf('まるごと1日セット') !== -1;
    }

    function timeInputValue(value) {
      var match = String(value || '').match(/(\d{1,2})\s*(?::|：|時)\s*(\d{1,2})/);

      if (!match) return '';

      var hour = Number(match[1]);
      var minute = Number(match[2]);

      if (hour > 23 || minute > 59) return '';

      return ('0' + hour).slice(-2) + ':' + ('0' + minute).slice(-2);
    }

    function addMinutesToTime(value, minutes) {
      var time = timeInputValue(value);
      if (!time) return '';

      var parts = time.split(':');
      var date = new Date(2000, 0, 1, Number(parts[0]), Number(parts[1]));
      date.setMinutes(date.getMinutes() + Number(minutes || 0));

      return ('0' + date.getHours()).slice(-2) + ':' +
        ('0' + date.getMinutes()).slice(-2);
    }

    function localDateString(date) {
      return date.getFullYear() + '-' +
        ('0' + (date.getMonth() + 1)).slice(-2) + '-' +
        ('0' + date.getDate()).slice(-2);
    }

    function addDays(dateText, days) {
      var parts = dateText.split('-');
      var date = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      date.setDate(date.getDate() + Number(days || 0));
      return localDateString(date);
    }

    function normalizeSearch(value) {
      return String(value || '')
        .toLowerCase()
        .replace(/[\s　\-ー]/g, '');
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function attr(value) {
      return escapeHtml(value).replace(/`/g, '&#096;');
    }
  })();
</script>
